spring.application.name=inventory-service
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=inventory

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
# spring.kafka.consumer.properties.spring.json.type.mapping=ORDER_CREATED:camellia.ecommerce.inventory_service.kafka.events.OrderEvent,ORDER_CANCELLED:camellia.ecommerce.inventory_service.kafka.events.OrderEvent
# spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=camellia.ecommerce.inventory_service.kafka.events.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=camellia.ecommerce.inventory_service.kafka.events

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs